<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Cellar Stalker — a stealth horror for one to five players</title>
    <meta name="description" content="Three ways out of her house, and she hears everything. A first-person stealth horror game for one to five players that plays in your browser." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="The Cellar Stalker" />
    <meta property="og:description" content="Three ways out of her house, and she hears everything. Browser stealth horror for one to five players." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050505'/%3E%3Cpath d='M6 32Q32 6 58 32Q32 58 6 32Z' fill='none' stroke='%23b03a2e' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ff3b28'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #cfc8b8; font-family: 'Courier New', Courier, monospace; text-align: center; transition: opacity 0.8s; padding: 24px; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 { font-family: 'Palatino Linotype', Palatino, Georgia, serif; font-weight: normal; font-size: clamp(28px, 5vw, 54px); letter-spacing: 0.2em; margin: 0 0 18px; }
      #boot h1 span { color: #b03a2e; }
      #boot p { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.7; animation: breathe 1.2s infinite alternate; max-width: 40em; line-height: 1.7; }
      #boot.error p { animation: none; opacity: 1; color: #ff8a78; letter-spacing: 0.12em; text-transform: none; }
      @keyframes breathe { to { opacity: 0.25; } }
      #notice { position: fixed; left: 0; right: 0; top: 0; z-index: 9; padding: 10px; background: #b03a2e; color: #fff; font: 13px 'Courier New', monospace; letter-spacing: 0.12em; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <h1>THE CELLAR <span>STALKER</span></h1>
      <p>Descending…</p>
    </div>
    <noscript>This game needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
